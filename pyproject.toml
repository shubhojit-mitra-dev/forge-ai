[project]
name = "forge-ai"
version = "0.1.0"
description = "ForgeAI: The Agent That Builds Agents — Unattended Agent Factory & Honest Eval Runner"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cachetools>=5.5.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "litellm>=1.55.0",
    "openai>=1.58.0",
    "pandas>=2.2.0",
    "pdfplumber>=0.11.4",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pyjwt>=2.10.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.18",
    "sse-starlette>=2.2.0",
    "structlog>=24.4.0",
    "supabase>=2.11.0",
    "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14.0",
    "pandas-stubs>=2.2.3",
    "pre-commit>=4.0.1",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "respx>=0.22.0",
    "ruff>=0.8.4",
    "types-cachetools>=5.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.coverage.run]
source = ["app"]
omit = ["app/__init__.py", "tests/*"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "\\.\\.\\.",
]
