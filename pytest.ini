[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -ra --strict-markers --tb=short
markers =
    unit: Fast deterministic unit tests with mocked I/O and LLM boundaries
    integration: Tests against real/local adapters, FastAPI TestClient, or Supabase
    e2e: Full pipeline end-to-end tests
    slow: Tests making live external LLM calls

